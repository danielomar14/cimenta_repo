              fill="none" stroke="#16324F" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="132" cy="8" r="5.5" fill="#16324F"/>
  </g>
  <g transform="translate(178,0)">
    <text x="0" y="92" font-family="'Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif"
