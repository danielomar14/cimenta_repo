  <!-- CIMENTA — Inteligencia inmobiliaria cuantitativa -->
  <!-- Isotipo: tres bloques ascendentes + trazo de plusvalía -->
  <g transform="translate(20,20)">
    <rect x="0"  y="68" width="34" height="44" fill="#AEB6BD"/>
    <rect x="44" y="36" width="34" height="76" fill="#2D7DD2"/>
    <rect x="88" y="0"  width="34" height="112" fill="#16324F"/>
    <polyline points="4,52 60,20 84,30 132,-6"
