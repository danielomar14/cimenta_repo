# =====================================================================
#  CIMENTA — Configuración del proyecto
# =====================================================================
#  Etapa 1 · Módulo M1 (Ingesta)
#  Top 10 portales inmobiliarios objetivo para CDMX y la Zona
#  Metropolitana del Valle de México (ZMVM).
#
#  Ranking por tráfico, cruzando Similarweb (top 5, may-2026) y
#  Semrush (abr-2026, visitas/mes). Se excluyeron sitios no relevantes
#  para CDMX (craigslist, zillow, idealista, foros).
#  Última actualización: 2026-06-12.
#
#  Cada portal es un objeto: { nombre, sitio }.
# =====================================================================

portales:
  - { nombre: "Inmuebles24",            sitio: "https://www.inmuebles24.com" }
  - { nombre: "Propiedades.com",        sitio: "https://propiedades.com" }
  - { nombre: "Vivanuncios",            sitio: "https://www.vivanuncios.com.mx" }
  - { nombre: "Lamudi",                 sitio: "https://www.lamudi.com.mx" }
  - { nombre: "Mercado Libre Inmuebles", sitio: "https://inmuebles.mercadolibre.com.mx" }
  - { nombre: "Pincali",                sitio: "https://www.pincali.com" }
  - { nombre: "Trovit Casas",           sitio: "https://casas.trovit.com.mx" }
  - { nombre: "EasyBroker",             sitio: "https://www.easybroker.com" }
  - { nombre: "iCasas",                 sitio: "https://www.icasas.mx" }
  - { nombre: "Casas y Terrenos",       sitio: "https://www.casasyterrenos.com" }


# =====================================================================
#  Configuración de ingesta (M1) por portal
# =====================================================================
ingesta:
  # ---- Casas y Terrenos (PoC, Nivel A) -------------------------------
  #  Next.js: los listados vienen en <script id="__NEXT_DATA__"> →
  #  props.pageProps.initialState.propertyData.properties
  #  URL: /{estado}/{municipio}/{tipo}/{operacion}?page=N  (240/pág, 1-indexed)
  #  Fecha disponible en el listado: lastUpdate (última actualización).
  casasyterrenos:
    base_url: "https://www.casasyterrenos.com"
    hits_per_page: 240
    meses_atras: 3            # filtro por lastUpdate (proxy de "publicación reciente")
    delay_seg: [1.5, 3.5]     # pausa aleatoria entre requests (cortesía)
    zonas:                    # {estado_slug: [municipio_slug, ...]}
      ciudad-de-mexico:       # CDMX — 16 alcaldías
        - alvaro-obregon
        - azcapotzalco
        - benito-juarez
        - coyoacan
        - cuajimalpa-de-morelos
        - cuauhtemoc
        - gustavo-a-madero
        - iztacalco
        - iztapalapa
        - la-magdalena-contreras
        - miguel-hidalgo
        - milpa-alta
        - tlahuac
        - tlalpan
        - venustiano-carranza
        - xochimilco
      estado-de-mexico:       # ZMVM — principales municipios conurbados
        - naucalpan-de-juarez
        - tlalnepantla-de-baz
        - ecatepec-de-morelos
        - nezahualcoyotl
        - huixquilucan
        - atizapan-de-zaragoza
        - cuautitlan-izcalli
        - coacalco-de-berriozabal
        - tultitlan
        - chimalhuacan
        - tecamac
        - la-paz
        - chalco
        - ixtapaluca
        - valle-de-chalco-solidaridad
    tipos:
      - casas
      - departamentos
      - terrenos
      - oficinas
      - locales-comerciales
      - bodegas
      - edificios
    operaciones:
      - venta
      - renta

  # ---- Lamudi (Nivel A) ----------------------------------------------
  #  Server-rendered: los listados vienen en JSON-LD (@graph → mainEntity →
  #  itemListElement → item, cada uno schema.org con geo/precio/m²/recámaras).
  #  URL: /{estado}/{operacion}/?page=N   (30/pág).  robots permite listados.
  #  OJO: Lamudi NO expone fecha de publicación → se toman anuncios ACTIVOS
  #  (sin filtro de 3 meses).
  lamudi:
    base_url: "https://www.lamudi.com.mx"
    estados:
      - distrito-federal       # CDMX
      - estado-de-mexico       # ZMVM (best-effort; puede redirigir)
    operaciones:               # slug_url: etiqueta
      for-sale: venta
      for-rent: renta
    max_pages: 100             # 30/pág → hasta 3000 por estado/operación
    delay_seg: [1.5, 3.5]

  # ---- Inmuebles24 (Nivel B — vía CloakBrowser) ----------------------
  #  Tras Cloudflare. Listados en el DOM (React, tarjetas "posting").
  #  URL: /{tipo}-en-{operacion}-en-{municipio}[-pagina-N].html  (30/pág).
  #  OJO: NO expone coordenadas → se geocodifica por colonia (src/ingesta/geocode.py).
  inmuebles24:
    base_url: "https://www.inmuebles24.com"
    warmup_url: "https://www.inmuebles24.com/"
    max_pages: 40              # I24 limita ~1000-1200 resultados visibles
    settle: 6.0               # segundos tras el warmup de Cloudflare
    tipos:                    # slug_url: etiqueta
      departamentos: departamentos
      casas: casas
      terrenos: terrenos
      oficinas: oficinas
      locales-comerciales: locales
      bodegas-comerciales: bodegas
    operaciones:              # slug_url: etiqueta
      venta: venta
      renta: renta
    municipios:               # CDMX (16) + ZMVM principales
      - benito-juarez
      - alvaro-obregon
      - azcapotzalco
      - coyoacan
      - cuajimalpa
      - cuauhtemoc
      - gustavo-a-madero
      - iztacalco
      - iztapalapa
      - magdalena-contreras
      - miguel-hidalgo
      - milpa-alta
      - tlahuac
      - tlalpan
      - venustiano-carranza
      - xochimilco
      - naucalpan
      - tlalnepantla
      - huixquilucan
      - atizapan-de-zaragoza
      - cuautitlan-izcalli
      - ecatepec

  # ---- Propiedades.com (Nivel B — vía CloakBrowser) ------------------
  #  Tras Cloudflare, pero Next.js: __NEXT_DATA__ → props.pageProps.results.properties
  #  ¡Trae coordenadas (latitude/longitude, valid_coords) y fechas (published/days_ago)!
  #  URL: /{estado}/{tipo}-{operacion}[?pagina=N]  (47/pág).
  propiedades:
    base_url: "https://propiedades.com"
    warmup_url: "https://propiedades.com/df/departamentos-venta"
    max_pages: 50
    meses_atras: 3
    settle: 6.0
    estados:                  # CDMX = df ; ZMVM = estado-de-mexico
      - df
      - estado-de-mexico
    tipos:
      - departamentos
      - casas
      - terrenos
      - oficinas
      - locales-comerciales
      - bodegas
      - edificios
    operaciones:              # slug_url: etiqueta
      venta: venta
      renta: renta

  # ---- Vivanuncios (Nivel B — vía CloakBrowser) ----------------------
  #  Mismo DOM "posting" de Navent que Inmuebles24 → se reutiliza su parser.
  #  URL: /s-{slug}/{loc-slug}/v1c{cat}l{loc}p{N}   (30/pág).
  #  Sin coords en la tarjeta → se geocodifica por colonia (geocode.py).
  vivanuncios:
    base_url: "https://www.vivanuncios.com.mx"
    warmup_url: "https://www.vivanuncios.com.mx/s-departamentos-en-venta/distrito-federal/v1c1294l1008p1"
    max_pages: 50
    settle: 6.0
    locaciones:               # loc_slug: loc_code
      distrito-federal: 1008
      estado-de-mexico: 1014
    categorias:               # {slug, cat, tipo, operacion}
      - { slug: "departamentos-en-venta",    cat: 1294, tipo: departamentos, operacion: venta }
      - { slug: "casas-en-venta",            cat: 1293, tipo: casas,         operacion: venta }
      - { slug: "venta-terrenos",            cat: 31,   tipo: terrenos,      operacion: venta }
      - { slug: "venta-oficinas",            cat: 32,   tipo: oficinas,      operacion: venta }
      - { slug: "venta-locales-comerciales", cat: 1112, tipo: locales,       operacion: venta }
      - { slug: "departamentos-en-renta",    cat: 1300, tipo: departamentos, operacion: renta }
      - { slug: "casas-en-renta",            cat: 1299, tipo: casas,         operacion: renta }
      - { slug: "renta-locales-comerciales", cat: 1276, tipo: locales,       operacion: renta }

  # ---- iCasas (Nivel A) ----------------------------------------------
  #  HTML con microdata schema.org (Residence + GeoCoordinates → coords reales).
  #  URL: /venta/habitacionales-{tipo}-distrito-federal-{alcaldia}-2_{tc}_1_0_{code}_0[/p_N]
  #  Paginación: sufijo /p_N. Precio en texto "N MX$". Solo venta (universo).
  icasas:
    base_url: "https://www.icasas.mx"
    max_pages: 40
    tipos:                    # nombre: código (tc)
      departamentos: 3
      casas: 5
    alcaldias:                # slug: código (alfabético 264-279)
      alvaro-obregon: 264
      azcapotzalco: 265
      benito-juarez: 266
      coyoacan: 267
      cuajimalpa-morelos: 268
      cuauhtemoc: 269
      gustavo-a-madero: 270
      iztacalco: 271
      iztapalapa: 272
      magdalena-contreras: 273
      miguel-hidalgo: 274
      milpa-alta: 275
      tlahuac: 276
      tlalpan: 277
      venustiano-carranza: 278
      xochimilco: 279


# =====================================================================
#  Google Drive — subida de fotos y respaldos
# =====================================================================
#  credentials.json / token.json están gitignored (NUNCA se versionan).
#  Reutiliza el cliente OAuth "Desktop" del proyecto FotMob.
drive:
  credentials: "credentials.json"        # OAuth client (Desktop)
  token: "token.json"                    # token ya autorizado
  scopes: ["https://www.googleapis.com/auth/drive"]
  carpeta_base: ["CIMENTA"]              # raíz en "Mi unidad"
  # Las fotos van a:  Mi unidad / CIMENTA / {portal} / fotos / {id}.zip
