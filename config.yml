# =====================================================================
#  CIMENTA — Configuración del proyecto
# =====================================================================
#  Etapa 1 · Módulo M1 (Ingesta)
#  Top 10 portales inmobiliarios objetivo para CDMX y la Zona
#  Metropolitana del Valle de México (ZMVM).
#
#  Ranking por tráfico, cruzando Similarweb (top 5, may-2026) y
#  Semrush (abr-2026, visitas/mes). Se excluyeron sitios no relevantes
#  para CDMX (craigslist, zillow, idealista, foros).
#  Última actualización: 2026-06-12.
#
#  Cada portal es un objeto: { nombre, sitio }.
# =====================================================================

portales:
  - { nombre: "Inmuebles24",            sitio: "https://www.inmuebles24.com" }
  - { nombre: "Propiedades.com",        sitio: "https://propiedades.com" }
  - { nombre: "Vivanuncios",            sitio: "https://www.vivanuncios.com.mx" }
  - { nombre: "Lamudi",                 sitio: "https://www.lamudi.com.mx" }
  - { nombre: "Mercado Libre Inmuebles", sitio: "https://inmuebles.mercadolibre.com.mx" }
  - { nombre: "Pincali",                sitio: "https://www.pincali.com" }
  - { nombre: "Trovit Casas",           sitio: "https://casas.trovit.com.mx" }
  - { nombre: "EasyBroker",             sitio: "https://www.easybroker.com" }
  - { nombre: "iCasas",                 sitio: "https://www.icasas.mx" }
  - { nombre: "Casas y Terrenos",       sitio: "https://www.casasyterrenos.com" }


# =====================================================================
#  Configuración de ingesta (M1) por portal
# =====================================================================
ingesta:
  # ---- Casas y Terrenos (PoC, Nivel A) -------------------------------
  #  Next.js: los listados vienen en <script id="__NEXT_DATA__"> →
  #  props.pageProps.initialState.propertyData.properties
  #  URL: /{estado}/{municipio}/{tipo}/{operacion}?page=N  (240/pág, 1-indexed)
  #  Fecha disponible en el listado: lastUpdate (última actualización).
  casasyterrenos:
    base_url: "https://www.casasyterrenos.com"
    hits_per_page: 240
    meses_atras: 3            # filtro por lastUpdate (proxy de "publicación reciente")
    delay_seg: [1.5, 3.5]     # pausa aleatoria entre requests (cortesía)
    zonas:                    # {estado_slug: [municipio_slug, ...]}
      ciudad-de-mexico:       # CDMX — 16 alcaldías
        - alvaro-obregon
        - azcapotzalco
        - benito-juarez
        - coyoacan
        - cuajimalpa-de-morelos
        - cuauhtemoc
        - gustavo-a-madero
        - iztacalco
        - iztapalapa
        - la-magdalena-contreras
        - miguel-hidalgo
        - milpa-alta
        - tlahuac
        - tlalpan
        - venustiano-carranza
        - xochimilco
      estado-de-mexico:       # ZMVM — principales municipios conurbados
        - naucalpan-de-juarez
        - tlalnepantla-de-baz
        - ecatepec-de-morelos
        - nezahualcoyotl
        - huixquilucan
        - atizapan-de-zaragoza
        - cuautitlan-izcalli
        - coacalco-de-berriozabal
        - tultitlan
        - chimalhuacan
        - tecamac
        - la-paz
        - chalco
        - ixtapaluca
        - valle-de-chalco-solidaridad
    tipos:
      - casas
      - departamentos
      - terrenos
      - oficinas
      - locales-comerciales
      - bodegas
      - edificios
    operaciones:
      - venta
      - renta


# =====================================================================
#  Google Drive — subida de fotos y respaldos
# =====================================================================
#  credentials.json / token.json están gitignored (NUNCA se versionan).
#  Reutiliza el cliente OAuth "Desktop" del proyecto FotMob.
drive:
  credentials: "credentials.json"        # OAuth client (Desktop)
  token: "token.json"                    # token ya autorizado
  scopes: ["https://www.googleapis.com/auth/drive"]
  carpeta_base: ["CIMENTA"]              # raíz en "Mi unidad"
  # Las fotos van a:  Mi unidad / CIMENTA / {portal} / fotos / {id}.zip
